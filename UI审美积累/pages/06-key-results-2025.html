*, *::before, *::after {

  margin: 0;
  padding: 0;
}

body {

/* Floating Showcase Navigation Bar for standalone pages */
.showcase-topbar {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 16px 6px 12px;
  background: rgba(15, 23, 19, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
  font-size: 13px;
  white-space: nowrap;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.showcase-topbar * {
  box-sizing: border-box;
}

.showcase-topbar:hover {
  background: rgba(15, 23, 19, 0.95);
  border-color: rgba(255, 255, 255, 0.3);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}

.showcase-topbar .btn-back,
.showcase-topbar .nav-back {

  align-items: center;
  gap: 6px;
  color: #e2e8f0;
  text-decoration: none;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  transition: background 0.2s, color 0.2s;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

.showcase-topbar .btn-back svg,
.showcase-topbar .nav-back svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.showcase-topbar .btn-back:hover,

  background: rgba(255, 255, 255, 0.18);

.showcase-topbar .page-title {

  font-weight: 500;

}

.showcase-topbar .btn-download {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  border: none;
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  text-decoration: none;
  box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
  transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
}

.showcase-topbar .btn-download svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.showcase-topbar .btn-download:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);
  filter: brightness(1.08);
}

.showcase-topbar .btn-download:active {
  transform: translateY(0);
}

/* Glassmorphism standard component */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), var(--glass-inner-glow);
  border-radius: 16px;
}

/* Badges */
.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;

  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
}

/* Utilities */
.text-gradient-gold {
  background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.text-gradient-green {
  background: linear-gradient(135deg, #86efac 0%, #22c55e 100%);

  -webkit-text-fill-color: transparent;
