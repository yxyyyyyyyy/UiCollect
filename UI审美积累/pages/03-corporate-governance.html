  <style>/* Inlined common.css */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap');

:root {
  --font-main: 'Montserrat', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: 'Montserrat', sans-serif;
  --font-serif: "Playfair Display", "Times New Roman", serif;
  
  /* Theme Colors */
  --c-agri-dark: #0a1f13;
  --c-agri-mid: #1b3d22;
  --c-agri-accent: #6cd974;
  --c-agri-gold: #e5b244;
  
  --c-oil-dark: #23160a;
  --c-oil-mid: #4a3014;
  --c-oil-amber: #f59e0b;
  --c-oil-cream: #fef3c7;
  
  --c-meat-dark: #220e10;
  --c-meat-mid: #44171b;
  --c-meat-red: #ef4444;
  --c-meat-coral: #f87171;
  
  --c-sugar-dark: #0b1a28;
  --c-sugar-mid: #163650;
  --c-sugar-cyan: #38bdf8;
  --c-sugar-ice: #e0f2fe;

  --c-bg-stone: #eae6df;
  --c-bg-editorial: #151e18;
  
  /* Glassmorphism primitives */
  --glass-bg: rgba(255, 255, 255, 0.12);
  --glass-border: rgba(255, 255, 255, 0.22);
  --glass-blur: blur(20px);
  --glass-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.37);
  --glass-inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.35);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: #ffffff;
  background-color: #0b0f0d;
  overflow-x: hidden;
  min-height: 100vh;
}

/* Floating Showcase Navigation Bar for standalone pages */
.showcase-topbar {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 16px 6px 12px;
  background: rgba(15, 23, 19, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
  font-size: 13px;
  white-space: nowrap;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.showcase-topbar * {
  box-sizing: border-box;
}

.showcase-topbar:hover {
  background: rgba(15, 23, 19, 0.95);
  border-color: rgba(255, 255, 255, 0.3);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}

.showcase-topbar .btn-back,
.showcase-topbar .nav-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #e2e8f0;
  text-decoration: none;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  transition: background 0.2s, color 0.2s;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

.showcase-topbar .btn-back svg,
.showcase-topbar .nav-back svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.showcase-topbar .btn-back:hover,
.showcase-topbar .nav-back:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}

.showcase-topbar .divider {
  width: 1px;
  height: 14px;
  background: rgba(255, 255, 255, 0.2);
}

.showcase-topbar .page-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #94a3b8;
}

.showcase-topbar .page-tag,
.showcase-topbar .badge-page {
  background: rgba(108, 217, 116, 0.15);
  color: #6cd974;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.showcase-topbar .page-title {
  color: #ffffff;
  font-weight: 500;
  max-width: 320px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
}

.showcase-topbar .btn-download {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  border: none;
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  text-decoration: none;
  box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
  transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
}

.showcase-topbar .btn-download svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.showcase-topbar .btn-download:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);
  filter: brightness(1.08);
}

.showcase-topbar .btn-download:active {
  transform: translateY(0);
}

/* Glassmorphism standard component */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), var(--glass-inner-glow);
  border-radius: 16px;
}

/* Badges */
.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
}

/* Utilities */
.text-gradient-gold {
  background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.text-gradient-green {
  background: linear-gradient(135deg, #86efac 0%, #22c55e 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Thumbnail / Screenshot Capture Mode (Pixel-perfect 1440x900 edge-to-edge) */
.thumb-mode .showcase-topbar,
body.thumb-mode .showcase-topbar,
html.thumb-mode .showcase-topbar {
  display: none !important;
}

html.thumb-mode,
html.thumb-mode body {
  width: 1440px !important;
  height: 900px !important;
  max-width: 1440px !important;
  max-height: 900px !important;
  padding: 0 !important;
  margin: 0 !important;
  overflow: hidden !important;
  display: block !important;
  background: transparent !important;
}

html.thumb-mode body > *:not(.showcase-topbar):not(script),
html.thumb-mode .cover-canvas,
html.thumb-mode .chapter-card,
html.thumb-mode .strategy-card,
html.thumb-mode .tech-canvas,
html.thumb-mode .tech-card-container,
html.thumb-mode .key-results-canvas,
html.thumb-mode .oil-intro-card,
html.thumb-mode .meat-intro-card,
html.thumb-mode .sugar-intro-card,
html.thumb-mode .dash-frame,
html.thumb-mode .dashboard-canvas,
html.thumb-mode .infographic-stage,
html.thumb-mode .quadrants-stage,
html.thumb-mode .model-stage,
html.thumb-mode .export-canvas {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  max-width: 1440px !important;
  width: 1440px !important;
  min-width: 1440px !important;
  height: 900px !important;
  min-height: 900px !important;
  max-height: 900px !important;
  border-radius: 0 !important;
  border: none !important;
  margin: 0 !important;
  box-shadow: none !important;
  transform: none !important;
}

    .ambient-glow {
      position: absolute;
      top: 20%;
      right: 15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, rgba(217, 119, 6, 0.1) 50%, transparent 70%);
      filter: blur(60px);
      z-index: 2;
      pointer-events: none;
    }

    /* Top Navigation Bar */
    .card-topbar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-pill {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 10px #f59e0b;
    }

    .top-actions {
      display: flex;
      gap: 12px;
    }

    .top-pill {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }

    /* Main Chapter Content Grid */
    .chapter-main {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 60px;
      align-items: center;
      margin: 40px 0;
    }

    .chapter-left {
      max-width: 640px;
    }

    .section-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.35);
