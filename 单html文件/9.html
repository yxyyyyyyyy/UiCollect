<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 装扮项目：UI 与导出功能实现</title>
    <style>
        /* --- 基础 CSS 样式 --- */
        body { margin: 0; overflow: hidden; background: #333747; font-family: -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; }
        canvas { display: block; }

        /* --- UI 控制面板样式 (复刻图中布局) --- */
        #ui-panel {
            position: absolute;
            top: 50%;
            left: 4vw;
            transform: translateY(-50%);
            z-index: 100;
            width: 290px;
            background: rgba(255, 252, 247, .92);
            padding: 28px;
            border: 1px solid rgba(124,105,93,.2);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(74,55,55,.12);
            backdrop-filter: blur(24px);
            color: #342e2c;
        }
        #ui-panel h4 {
            margin-top: 0;
            border-bottom: 1px solid #e7dbd0;
            padding-bottom: 18px;
            font-size: 23px;
            letter-spacing: .09em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ui-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .ui-row label {
            width: 120px;
            font-size: 12px;
            font-weight: 600;
        }
        .ui-row input[type="text"], .ui-row select {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #e8dcd3;
            border-radius: 9px;
            background: #fff;
        }
        .ui-row input[type="color"] {
            width: 80px;
            height: 30px;
            padding: 2px;
            border: none;
        }
        #export-button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #58494d;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #export-button:hover {
            background-color: #806d70;
        }
        .studio-label { position:absolute;top:6%;right:6%;z-index:2;text-align:right;color:#faf0e7;pointer-events:none; }
        .studio-label small { letter-spacing:.29em;font-size:11px;color:#e2c5c4; }
        .studio-label h1 { margin:8px 0;font-weight:300;font-size:clamp(32px,4vw,64px);letter-spacing:.1em; }
        .studio-label p {font-size:13px;color:#d8ccd0;letter-spacing:.08em}
        #webgl-fallback {position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 54% 55%,#fdf8f2,#ded2cc);color:#645452;text-align:center}
        #webgl-fallback[hidden] {display:none}
        #webgl-fallback strong {display:block;font-size:40px;font-weight:300;letter-spacing:.2em}
        @media(max-width:700px){#ui-panel{top:auto;left:3%;right:3%;bottom:2%;transform:none;width:auto;padding:14px;max-height:40vh;overflow:auto}#ui-panel h4{font-size:17px;margin-bottom:10px}#ui-panel .ui-row{margin-bottom:8px}.studio-label{top:2%;right:4%}.studio-label p{display:none}}
    </style>
</head>
<body>

<div id="webgl-fallback"><div><strong>衣橱试验室</strong><p>正在准备 3D 试衣台…</p></div></div>
<div class="studio-label"><small>STYLE LAB / 3D DRESS-UP</small><h1>衣橱试验室</h1><p>换件衣服，转个角度，再带走一张照片。</p></div>

<div id="ui-panel">
    <h4>搭配一套喜欢的 <span style="font-size:12px;color:#a18d85;font-weight:400">自由旋转预览</span></h4>
    
    <div class="ui-row">
        <label for="char-select">角色：</label>
        <select id="char-select" onchange="changeCharacter(this.value)">
            <option value="ModelA">模型 A</option>
            <option value="ModelB">模型 B</option>
        </select>
    </div>
    
    <div class="ui-row">
        <label for="hair-select">发型：</label>
        <select id="hair-select" onchange="changeAccessory('Hair', this.value)">
            <option value="hair1">短发</option>
            <option value="hair2">长发</option>
        </select>
    </div>
    
    <div class="ui-row">
        <label for="top-select">上装：</label>
        <select id="top-select" onchange="changeAccessory('Top', this.value)">
            <option value="top1">柔白上衣</option>
            <option value="top2">莓红短夹克</option>
        </select>
    </div>

    <div class="ui-row">
        <label for="top-color">上装颜色：</label>
        <input type="color" id="top-color" value="#be9ba4" onchange="changeColor('Top', this.value)">
    </div>

    <div class="ui-row">
        <label for="bottom-select">下装：</label>
        <select id="bottom-select" onchange="changeAccessory('Bottom', this.value)">
            <option value="bottom2">百褶半裙</option>
            <option value="bottom1">雾蓝长裤</option>
        </select>
    </div>
    
    <div class="ui-row">
        <label for="bottom-color">下装颜色：</label>
        <input type="color" id="bottom-color" value="#6f8898" onchange="changeColor('Bottom', this.value)">
    </div>

    <button id="export-button" onclick="exportPhoto()">生成高清照片</button>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

<script>
    let scene, camera, renderer, controls;
    let characterGroup; // 主人物模型组
    const accessories = {}; // 存储所有装扮品的对象

    // 占位符模型路径（实际项目中需要替换成您的 GLB 文件）
    // 我将使用 Three.js 自带的几何体作为占位符
    const ACCESSORIES_DATA = {
        'Hair': {
            'hair1': { color: 0x554047, geometry: new THREE.SphereGeometry(0.3, 32, 32) },
            'hair2': { color: 0x40343d, geometry: new THREE.SphereGeometry(0.34, 32, 32) }
        },
        'Top': {
            'top1': { color: 0xbe9ba4, geometry: new THREE.CylinderGeometry(0.28, 0.35, 0.65, 32) },
            'top2': { color: 0x9b5b69, geometry: new THREE.CylinderGeometry(0.32, 0.36, 0.6, 32) }
        },
        'Bottom': {
            'bottom1': { color: 0x8ba6b5, geometry: new THREE.CylinderGeometry(0.31, 0.26, 0.9, 32) },
            'bottom2': { color: 0x6f8898, geometry: new THREE.CylinderGeometry(0.31, 0.75, 0.9, 48) }
        }
    };

    // 1. 初始化 Three.js 场景
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333747);

        // 渲染器 (PBR配置)
        renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); // preserveDrawingBuffer: true 开启导出功能
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 0.82;
        document.body.appendChild(renderer.domElement);
        document.getElementById('webgl-fallback').hidden = true;

        // 相机
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.55, 3.8);
        
        // 控件 (I1.1 3D 视角操作)
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.0, 0); 
        controls.enableDamping = true; 

        // 辅助网格 (复刻图中效果)
        const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.4,.2,64),new THREE.MeshStandardMaterial({color:0xbbb5bd,roughness:.75}));
        pedestal.position.y=-.12; scene.add(pedestal);
        const arch = new THREE.Mesh(new THREE.TorusGeometry(1.8,.025,10,80,Math.PI),new THREE.MeshBasicMaterial({color:0xe7c5bc,transparent:true,opacity:.72}));
        arch.position.set(0,1.55,-.95);scene.add(arch);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:0x303341}));
        floor.rotation.x=-Math.PI/2;floor.position.y=-.23;scene.add(floor);
        
        // **V2.3 光照环境**：添加环境光和主光
        scene.add(new THREE.HemisphereLight(0xffeee3,0x756b7c,.58));
        const dirLight = new THREE.DirectionalLight(0xffe9d6, .75);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        const rim = new THREE.DirectionalLight(0xa9c7d6,.36);rim.position.set(-5,5,-4);scene.add(rim);

        characterGroup = new THREE.Group();
        scene.add(characterGroup);

        window.addEventListener('resize', onWindowResize, false);
        
        // 初始加载 Model A
        loadCharacter('ModelA');
    }

    // 2. 加载/切换固定人物模型
    function loadCharacter(modelName) {
        characterGroup.clear(); // 清除旧模型
        
        // ** 模拟加载基础人物模型（Model A）**
        // 实际：使用 GLTFLoader 加载 GLB 文件
        const skin = new THREE.MeshStandardMaterial({color:modelName==='ModelB'?0xb87b65:0xe8a98e,roughness:.9});
        const addPart=(geo,mat,x,y,z)=>{const mesh=new THREE.Mesh(geo,mat);mesh.position.set(x,y,z);characterGroup.add(mesh);return mesh};
        addPart(new THREE.SphereGeometry(.26,32,32),skin,0,2.22,0);
        addPart(new THREE.CylinderGeometry(.085,.095,.24,24),skin,0,1.93,0);
        const eyeMat=new THREE.MeshStandardMaterial({color:0x40343a,roughness:.25});
        const cheekMat=new THREE.MeshBasicMaterial({color:0xd98b86,transparent:true,opacity:.65});
        for(const x of [-.105,.105]){
            const eye=addPart(new THREE.SphereGeometry(.025,16,16),eyeMat,x,2.235,.244);eye.scale.set(1,1.25,.45);
            const cheek=addPart(new THREE.SphereGeometry(.045,12,12),cheekMat,x*1.47,2.16,.225);cheek.scale.set(1,.55,.25);
        }
        addPart(new THREE.SphereGeometry(.018,12,12),new THREE.MeshBasicMaterial({color:0xaa6665}),0,2.14,.26);
        for(const x of [-.42,.42]){const arm=addPart(new THREE.CylinderGeometry(.085,.065,.78,16),skin,x,1.34,0);arm.rotation.z=x>0?-.35:.35;}
        for(const x of [-.16,.16]){addPart(new THREE.CylinderGeometry(.12,.11,.82,16),skin,x,.46,0);addPart(new THREE.SphereGeometry(.16,16,16),new THREE.MeshStandardMaterial({color:0x645657}),x,.06,.1);}
        const collarMat=new THREE.MeshStandardMaterial({color:0xa88c9c,roughness:.7});
        const collar=addPart(new THREE.TorusGeometry(.13,.035,8,24),collarMat,0,1.87,.04);collar.rotation.x=Math.PI/2;
        const bow=addPart(new THREE.OctahedronGeometry(.085),collarMat,0,1.76,.35);bow.scale.set(1.7,.6,.6);

        // 统一创建并存储所有装扮品
        for (const category in ACCESSORIES_DATA) {
            accessories[category] = {};
            for (const name in ACCESSORIES_DATA[category]) {
                const data = ACCESSORIES_DATA[category][name];
                const mat = new THREE.MeshPhysicalMaterial({ color: data.color, metalness: 0.1, roughness: 0.5 });
                let mesh;
                if(category==='Bottom' && name==='bottom1'){
                    mesh=new THREE.Group();
                    for(const x of [-.16,.16]){
                        const leg=new THREE.Mesh(new THREE.CylinderGeometry(.15,.14,.9,24),mat);
                        leg.position.x=x;mesh.add(leg);
                    }
                } else mesh = new THREE.Mesh(data.geometry, mat);
                if(category==='Bottom' && name==='bottom2'){
                    const pleatMaterial=new THREE.MeshStandardMaterial({color:0xb8ced2,roughness:.8});
                    for(let i=0;i<24;i++){
                        const angle=i*Math.PI*2/24;
                        const pleat=new THREE.Mesh(new THREE.CylinderGeometry(.012,.016,.98,6),pleatMaterial);
                        const outward=new THREE.Vector3(Math.cos(angle)*.4,-.9,Math.sin(angle)*.4).normalize();
                        pleat.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),outward);
                        pleat.position.set(Math.cos(angle)*.52,0,Math.sin(angle)*.52);
                        pleat.userData.decorative=true;
                        mesh.add(pleat);
                    }
                }
                mesh.name = `${category}-${name}`;
                mesh.position.y = category==='Hair'?2.39:category==='Top'?1.58:.81;
                if(category==='Hair') {
                    if(name==='hair1') mesh.scale.set(1,.58,1);
                    else {mesh.scale.set(1.15,1.45,.85);mesh.position.y=2.31;mesh.position.z=-.08;}
                    for(const x of [-.14,0,.14]){
                        const bang=new THREE.Mesh(new THREE.SphereGeometry(.1,12,12),mat);
                        bang.position.set(x,-.1,.2);bang.scale.set(1,.7,.75);mesh.add(bang);
                    }
                }
                mesh.visible = false;
                accessories[category][name] = mesh;
                characterGroup.add(mesh); // 将所有装扮品加入场景
            }
        }
        
        // 默认应用初始装扮
        changeAccessory('Hair', 'hair1');
        changeAccessory('Top', 'top1');
        changeAccessory('Bottom', 'bottom2');
        
        console.log(`已加载人物模型: ${modelName}`);
    }

    // 3. 实时切换装扮逻辑
    window.changeAccessory = function(category, name) {
        // 隐藏同类别所有旧装扮
        for (const key in accessories[category]) {
            accessories[category][key].visible = false;
        }
        
        // 显示新装扮
        const newAccessory = accessories[category][name];
        if (newAccessory) {
            newAccessory.visible = true;
            console.log(`切换 ${category} 到 ${name}`);
        }
    }
    
    // 4. 实时切换颜色逻辑
    window.changeColor = function(category, colorHex) {
        for (const key in accessories[category]) {
            const mesh = accessories[category][key];
            if (mesh.visible) {
                mesh.traverse(part => { if(part.isMesh && !part.userData.decorative) part.material.color.set(colorHex); });
                console.log(`更新 ${category} 颜色为 ${colorHex}`);
            }
        }
    }

    // 5. 生成高清照片 (P3.2 图像导出)
    window.exportPhoto = function() {
        // 1. 强制渲染一次，确保画布是最新的状态
        renderer.render(scene, camera); 
        
        // 2. 将画布内容导出为 Blob/DataURL
        const strMime = 'image/png';
        const imgData = renderer.domElement.toDataURL(strMime);

        // 3. 模拟下载行为
        const link = document.createElement('a');
        link.download = '3D_Outfit_Photo_' + Date.now() + '.png';
        link.href = imgData;
        link.click();
        
        alert('高清照片已生成并下载！');
        console.log('照片导出完成。');
    }

    // 动画循环：标签页隐藏时不再持续渲染，低动态模式降到约 20 帧。
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let lastRenderedAt = 0;
    function animate(timestamp = 0) {
        requestAnimationFrame(animate);
        if (document.hidden) return;
        if (reducedMotion.matches && timestamp - lastRenderedAt < 50) return;
        lastRenderedAt = timestamp;
        controls.update(); 
        renderer.render(scene, camera);
    }

    // 窗口调整
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // 启动流程
    init();
    animate();
</script>

</body>
</html>
