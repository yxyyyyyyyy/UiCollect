<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liquid Dream - AI Fluid</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none; 
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 200; letter-spacing: 2px; }
        p { margin: 5px 0 0 0; font-size: 0.8rem; opacity: 0.6; }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.1); }
        .btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* --- AI Camera UI --- */
        #camera-ui {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 20;
            pointer-events: none; 
        }

        #ai-toggle-btn {
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
        }
        #ai-toggle-btn:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        #ai-toggle-btn.active {
            background: rgba(255, 50, 50, 0.2);
            border-color: rgba(255, 50, 50, 0.5);
            color: #ff5555;
        }

        #camera-preview {
            width: 160px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-top: 10px;
            display: none;
            transform: scaleX(-1);
            background: #000;
            pointer-events: auto;
            position: relative;
        }
        
        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #tracker-point {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #ff0055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            pointer-events: none;
            display: none;
            box-shadow: 0 0 20px #ff0055, inset 0 0 10px #ff0055;
            transition: left 0.1s ease-out, top 0.1s ease-out;
        }

        #ai-status-text {
            font-size: 12px;
            color: rgba(255,255,255,0.8);
            margin-top: 5px;
            display: none;
            text-shadow: 0 1px 2px black;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }

    </style>
</head>
<body>

    <canvas id="glcanvas"></canvas>

    <!-- 追踪点指示器 -->
    <div id="tracker-point"></div>

    <div id="ui-layer">
        <h1>Liquid Dream</h1>
        <p>鼠标拖拽 · 点击爆发 · 摄像头隔空搅动</p>
    </div>

    <div id="controls">
        <button class="btn" onclick="resetFluid()" title="重置">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button class="btn" onclick="togglePause()" title="暂停/继续">
            <svg id="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
    </div>

    <div id="camera-ui">
        <button id="ai-toggle-btn" onclick="toggleCamera()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
            </svg>
            开启摄像头手势
        </button>
        <div id="ai-status-text">正在初始化 AI 模型...</div>
        <div id="camera-preview">
            <video id="input_video" playsinline autoplay muted></video>
        </div>
    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Shaders -->
    <script id="base-vs" type="x-shader/x-vertex">
        attribute vec2 aPosition;
        varying vec2 vUv;
        void main () {
            vUv = aPosition * 0.5 + 0.5;
            gl_Position = vec4(aPosition, 0.0, 1.0);
        }
    </script>

    <script id="clear-fs" type="x-shader/x-fragment">
        precision mediump float;
        uniform float value;
        void main () { gl_FragColor = value * vec4(1.0, 1.0, 1.0, 1.0); }
    </script>

    <script id="display-fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        void main () {
            vec3 C = texture2D(uTexture, vUv).rgb;
            gl_FragColor = vec4(pow(C, vec3(0.45)), 1.0);
        }
    </script>

    <script id="splat-fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vUv;
        uniform sampler2D uTarget;
        uniform float aspectRatio;
        uniform vec3 color;
        uniform vec2 point;
        uniform float radius;
        void main () {
            vec2 p = vUv - point.xy;
            p.x *= aspectRatio;
            vec3 splat = exp(-dot(p, p) / radius) * color;
            vec3 base = texture2D(uTarget, vUv).xyz;
            gl_FragColor = vec4(base + splat, 1.0);
        }
    </script>

    <script id="advection-fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 texelSize;
        uniform float dt;
        uniform float dissipation;
        void main () {
            vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
            gl_FragColor = dissipation * texture2D(uSource, coord);
        }
    </script>

    <script id="divergence-fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform vec2 texelSize;
        void main () {
            float L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).x;
            float R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).x;
            float T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).y;
            float B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).y;
            vec2 C = texture2D(uVelocity, vUv).xy;
            if (vUv.x < texelSize.x) L = -C.x;
            if (vUv.x > 1.0 - texelSize.x) R = -C.x;
            if (vUv.y < texelSize.y) B = -C.y;
            if (vUv.y > 1.0 - texelSize.y) T = -C.y;
            float div = 0.5 * (R - L + T - B);
            gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
        }
    </script>

    <script id="curl-fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform vec2 texelSize;
        void main () {
            float L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).y;
            float R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).y;
            float T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).x;
            float B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).x;
            float vorticity = R - L - T + B;
            gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
        }
    </script>

    <script id="vorticity-fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uCurl;
        uniform float curl;
        uniform float dt;
        uniform vec2 texelSize;
        void main () {
            float L = texture2D(uCurl, vUv - vec2(texelSize.x, 0.0)).x;
            float R = texture2D(uCurl, vUv + vec2(texelSize.x, 0.0)).x;
            float T = texture2D(uCurl, vUv + vec2(0.0, texelSize.y)).x;
            float B = texture2D(uCurl, vUv - vec2(0.0, texelSize.y)).x;
            float C = texture2D(uCurl, vUv).x;
            vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
            force /= length(force) + 0.0001;
            force *= curl * C;
            force.y *= -1.0;
            vec2 vel = texture2D(uVelocity, vUv).xy;
            gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
        }
    </script>

    <script id="pressure-fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vUv;
        uniform sampler2D uPressure;
        uniform sampler2D uDivergence;
        uniform vec2 texelSize;
        void main () {
            float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;
            float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;
            float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;
            float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;
            float divergence = texture2D(uDivergence, vUv).x;
            float pressure = (L + R + B + T - divergence) * 0.25;
            gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
        }
    </script>

    <script id="gradient-subtract-fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vUv;
        uniform sampler2D uPressure;
        uniform sampler2D uVelocity;
        uniform vec2 texelSize;
        void main () {
            float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;
            float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;
            float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;
            float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;
            vec2 velocity = texture2D(uVelocity, vUv).xy;
            velocity.xy -= vec2(R - L, T - B);
            gl_FragColor = vec4(velocity, 0.0, 1.0);
        }
    </script>

    <script>
        const canvas = document.getElementById('glcanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const config = {
            TEXTURE_DOWNSAMPLE: 1, 
            DENSITY_DISSIPATION: 0.98,
            VELOCITY_DISSIPATION: 0.98,
            PRESSURE_DISSIPATION: 0.8,
            PRESSURE_ITERATIONS: 20,
            CURL: 30,
            SPLAT_RADIUS: 0.005
        };

        let gl = canvas.getContext('webgl');
        const ext = {
            formatRGBA: getSupportedFormat(gl, gl.RGBA, gl.RGBA, getHalfFloatExt(gl)),
            formatRG: getSupportedFormat(gl, gl.RGBA, gl.RGBA, getHalfFloatExt(gl)), 
            formatR: getSupportedFormat(gl, gl.RGBA, gl.RGBA, getHalfFloatExt(gl)),  
            halfFloatTexType: getHalfFloatExt(gl) ? getHalfFloatExt(gl).HALF_FLOAT_OES : gl.UNSIGNED_BYTE,
            supportLinearFiltering: gl.getExtension('OES_texture_half_float_linear')
        };

        function getHalfFloatExt(gl) { return gl.getExtension('OES_texture_half_float'); }
        function getSupportedFormat(gl, internalFormat, format, type) { if (!type) return null; return { internalFormat, format }; }

        class Program {
            constructor(vertexShader, fragmentShader) {
                this.uniforms = {};
                this.program = createProgram(vertexShader, fragmentShader);
                this.uniforms = getUniforms(this.program);
            }
            bind() { gl.useProgram(this.program); }
        }

        function createProgram(vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            return program;
        }

        function getUniforms(program) {
            let uniforms = {};
            let uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
            for (let i = 0; i < uniformCount; i++) {
                let uniformName = gl.getActiveUniform(program, i).name;
                uniforms[uniformName] = gl.getUniformLocation(program, uniformName);
            }
            return uniforms;
        }

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const baseVertexShader = compileShader(gl.VERTEX_SHADER, document.getElementById('base-vs').innerText);
        
        const clearProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('clear-fs').innerText));
        const displayProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('display-fs').innerText));
        const splatProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('splat-fs').innerText));
        const advectionProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('advection-fs').innerText));
        const divergenceProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('divergence-fs').innerText));
        const curlProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('curl-fs').innerText));
        const vorticityProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('vorticity-fs').innerText));
        const pressureProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('pressure-fs').innerText));
        const gradientSubtractProgram = new Program(baseVertexShader, compileShader(gl.FRAGMENT_SHADER, document.getElementById('gradient-subtract-fs').innerText));

        let density, velocity, divergence, curl, pressure;

        function initFramebuffers() {
            let simRes = getResolution(config.TEXTURE_DOWNSAMPLE);
            let dyeRes = getResolution(1);

            const texType = ext.halfFloatTexType;
            const rgba = ext.formatRGBA;
            const rg = ext.formatRG;
            const r = ext.formatR;
            const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

            if (!density) density = createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
            else density = resizeDoubleFBO(density, dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);

            if (!velocity) velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
            else velocity = resizeDoubleFBO(velocity, simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);

            divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
            curl = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
            pressure = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
        }

        function getResolution(resolution) {
            let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
            if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
            let min = Math.round(gl.drawingBufferHeight * resolution);
            let max = Math.round(gl.drawingBufferWidth * resolution);
            return gl.drawingBufferWidth > gl.drawingBufferHeight ? { width: max, height: min } : { width: min, height: max };
        }

        function createFBO(w, h, internalFormat, format, type, param) {
            gl.activeTexture(gl.TEXTURE0);
            let texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
            let fbo = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
            gl.viewport(0, 0, w, h);
            gl.clear(gl.COLOR_BUFFER_BIT);
            return { texture, fbo, width: w, height: h, attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id; } };
        }

        function createDoubleFBO(w, h, internalFormat, format, type, param) {
            let fbo1 = createFBO(w, h, internalFormat, format, type, param);
            let fbo2 = createFBO(w, h, internalFormat, format, type, param);
            return {
                width: w, height: h, texelSizeX: 1.0 / w, texelSizeY: 1.0 / h,
                get read() { return fbo1; }, set read(value) { fbo1 = value; },
                get write() { return fbo2; }, set write(value) { fbo2 = value; },
                swap() { let temp = fbo1; fbo1 = fbo2; fbo2 = temp; }
            };
        }
        
        function resizeDoubleFBO(target, w, h, internalFormat, format, type, param) {
            if (target.width === w && target.height === h) return target;
            return createDoubleFBO(w, h, internalFormat, format, type, param);
        }

        const blit = (() => {
            gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(0);
            return (destination) => {
                gl.bindFramebuffer(gl.FRAMEBUFFER, destination ? destination.fbo : null);
                gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
            }
        })();

        initFramebuffers();
        let lastTime = Date.now();
        let isPaused = false;
        let splats = []; 

        // 自动产生一些流体以证明它在工作
        setTimeout(() => {
            for(let i=0; i<3; i++) {
                splat(window.innerWidth/2 + (Math.random()-0.5)*200, window.innerHeight/2 + (Math.random()-0.5)*200, (Math.random()-0.5)*1000, (Math.random()-0.5)*1000, generateColor());
            }
        }, 500);

        // --- AI Camera Logic ---
        let isCameraActive = false;
        let cameraUtils;
        let hands;
        let prevHandX = null;
        let prevHandY = null;
        let handColor = generateColor();

        async function toggleCamera() {
            if (isCameraActive) {
                location.reload(); 
                return;
            }

            const btn = document.getElementById('ai-toggle-btn');
            const statusText = document.getElementById('ai-status-text');
            const videoElement = document.getElementById('input_video');
            const preview = document.getElementById('camera-preview');

            btn.innerHTML = '正在初始化...';
            statusText.style.display = 'block';
            preview.style.display = 'block'; // Ensure video has size

            hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            try {
                cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 320,
                    height: 240
                });
                await cameraUtils.start();

                isCameraActive = true;
                btn.innerHTML = '关闭手势控制';
                btn.classList.add('active');
                statusText.style.display = 'none';

            } catch (err) {
                console.error(err);
                alert("摄像头启动失败，请检查权限");
                btn.innerHTML = '启动失败';
            }
        }

        function onHandsResults(results) {
            const point = document.getElementById('tracker-point');
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8]; // 食指指尖
                
                // Mirror coordinates for intuitive interaction
                const x = (1 - indexTip.x) * canvas.width;
                const y = indexTip.y * canvas.height;

                point.style.display = 'block';
                point.style.left = x + 'px';
                point.style.top = y + 'px';

                // Calculate velocity based on movement
                if (prevHandX !== null) {
                    let dx = x - prevHandX;
                    let dy = y - prevHandY;
                    
                    // 增强手势的力度感，即使移动很慢也有效果
                    const forceMultiplier = 15.0; 
                    
                    // 如果手几乎静止，给一点微小的随机扰动，让它看起来在"散发能量"
                    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
                       dx = (Math.random() - 0.5) * 5;
                       dy = (Math.random() - 0.5) * 5;
                    }

                    // Cycle color
                    const time = Date.now() * 0.002;
                    handColor = HSVtoRGB((time % 10) / 10, 1.0, 1.0);
                    handColor.r *= 0.18; handColor.g *= 0.18; handColor.b *= 0.18; // Increase brightness slightly
                    
                    splat(x, y, dx * forceMultiplier, dy * forceMultiplier, handColor);
                }

                prevHandX = x;
                prevHandY = y;
            } else {
                point.style.display = 'none';
                prevHandX = null;
                prevHandY = null;
            }
        }

        // --- Main Loop ---
        update();

        function update() {
            if (isPaused) {
                requestAnimationFrame(update);
                return;
            }

            const dt = Math.min((Date.now() - lastTime) / 1000, 0.016);
            lastTime = Date.now();
            
            gl.viewport(0, 0, velocity.width, velocity.height);

            advectionProgram.bind();
            gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
            gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
            gl.uniform1i(advectionProgram.uniforms.uSource, velocity.read.attach(0));
            gl.uniform1f(advectionProgram.uniforms.dt, dt);
            gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
            blit(velocity.write);
            velocity.swap();

            gl.viewport(0, 0, density.width, density.height);
            advectionProgram.bind();
            gl.uniform2f(advectionProgram.uniforms.texelSize, density.texelSizeX, density.texelSizeY);
            gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
            gl.uniform1i(advectionProgram.uniforms.uSource, density.read.attach(1));
            gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
            blit(density.write);
            density.swap();

            processSplats();

            gl.viewport(0, 0, velocity.width, velocity.height);
            curlProgram.bind();
            gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
            gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
            blit(curl);

            vorticityProgram.bind();
            gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
            gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
            gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
            gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
            gl.uniform1f(vorticityProgram.uniforms.dt, dt);
            blit(velocity.write);
            velocity.swap();

            divergenceProgram.bind();
            gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
            gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
            blit(divergence);

            clearProgram.bind();
            gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE_DISSIPATION);
            blit(pressure.write);
            pressure.swap();

            pressureProgram.bind();
            gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
            gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
            for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
                gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
                blit(pressure.write);
                pressure.swap();
            }

            gradientSubtractProgram.bind();
            gl.uniform2f(gradientSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
            gl.uniform1i(gradientSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
            gl.uniform1i(gradientSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
            blit(velocity.write);
            velocity.swap();

            gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
            displayProgram.bind();
            gl.uniform1i(displayProgram.uniforms.uTexture, density.read.attach(0));
            blit(null);

            requestAnimationFrame(update);
        }

        // --- Interaction ---
        function splat(x, y, dx, dy, color) {
            splats.push({x, y, dx, dy, color});
        }

        function processSplats() {
            splatProgram.bind();
            gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
            gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
            
            for (let i = 0; i < splats.length; i++) {
                const s = splats[i];
                const coord = { x: s.x / canvas.width, y: 1.0 - s.y / canvas.height };
                
                gl.viewport(0, 0, velocity.width, velocity.height);
                gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
                gl.uniform3f(splatProgram.uniforms.color, s.dx, -s.dy, 1.0);
                gl.uniform2f(splatProgram.uniforms.point, coord.x, coord.y);
                gl.uniform1f(splatProgram.uniforms.radius, config.SPLAT_RADIUS);
                blit(velocity.write);
                velocity.swap();

                gl.viewport(0, 0, density.width, density.height);
                gl.uniform1i(splatProgram.uniforms.uTarget, density.read.attach(0));
                gl.uniform3f(splatProgram.uniforms.color, s.color.r, s.color.g, s.color.b);
                blit(density.write);
                density.swap();
            }
            splats = [];
        }

        let pointers = [];
        
        canvas.addEventListener('mousedown', e => {
            pointers.push({ id: -1, x: e.offsetX, y: e.offsetY, color: generateColor() });
        });

        canvas.addEventListener('mousemove', e => {
            let pointer = pointers.find(p => p.id === -1);
            if (!pointer) return;
            const dx = e.offsetX - pointer.x;
            const dy = e.offsetY - pointer.y;
            pointer.x = e.offsetX;
            pointer.y = e.offsetY;
            splat(pointer.x, pointer.y, dx * 5, dy * 5, pointer.color);
        });

        canvas.addEventListener('mouseup', () => {
            pointers = pointers.filter(p => p.id !== -1);
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                let t = e.touches[i];
                pointers.push({ id: t.identifier, x: t.clientX, y: t.clientY, color: generateColor() });
            }
        });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                let t = e.touches[i];
                let p = pointers.find(p => p.id === t.identifier);
                if (!p) continue;
                const dx = t.clientX - p.x;
                const dy = t.clientY - p.y;
                p.x = t.clientX;
                p.y = t.clientY;
                splat(p.x, p.y, dx * 5, dy * 5, p.color);
            }
        });

        canvas.addEventListener('touchend', e => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                pointers = pointers.filter(p => p.id !== e.changedTouches[i].identifier);
            }
        });

        function generateColor() {
            let c = HSVtoRGB(Math.random(), 1.0, 1.0);
            c.r *= 0.15; c.g *= 0.15; c.b *= 0.15;
            return c;
        }

        function HSVtoRGB(h, s, v) {
            let r, g, b, i, f, p, q, t;
            i = Math.floor(h * 6);
            f = h * 6 - i;
            p = v * (1 - s);
            q = v * (1 - f * s);
            t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return { r, g, b };
        }

        function resetFluid() {
            initFramebuffers();
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-icon').innerHTML = isPaused ? 
                '<path d="M8 5v14l11-7z"/>' : 
                '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            if (!isPaused) update();
        }
    </script>
</body>
