<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习课程仪表盘 - Learning Dashboard</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用 Inter 字体 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            /* 极深的背景色，模仿图片 */
            background-color: #0F0916; 
            color: #FFFFFF;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 8rem; /* 为底部导航留出空间 */
        }

        /* 抽象的背景光晕/Blob 样式 */
        .abstract-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px); /* 更大的模糊度 */
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
            transform: rotate(45deg);
        }

        .blob-1 { top: -100px; left: -150px; width: 320px; height: 320px; background-color: #7C3AED; } /* 紫色光晕 */
        .blob-2 { top: 200px; right: -100px; width: 256px; height: 256px; background-color: #FACC15; } /* 黄色光晕 */

        /* 课程卡片背景色，使用 Tailwind 的透明度 */
        .card-bg-1 { background-color: rgba(139, 92, 246, 0.4); } /* Purple 500/40 */
        .card-bg-2 { background-color: rgba(250, 204, 21, 0.4); } /* Yellow 400/40 */
        .card-bg-3 { background-color: rgba(45, 212, 191, 0.4); } /* Cyan 500/40 */
        .card-bg-4 { background-color: rgba(236, 72, 153, 0.4); } /* Pink 500/40 */
        
        /* 底部导航栏样式 */
        .bottom-nav {
            background-color: rgba(0, 0, 0, 0.5); /* 黑色半透明底色 */
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="relative">

    <!-- 抽象背景光晕 -->
    <div class="abstract-blob blob-1"></div>
    <div class="abstract-blob blob-2"></div>

    <!-- 主容器 -->
    <div class="relative z-10 max-w-6xl mx-auto p-4 md:p-8">
        
        <!-- 顶部用户信息和搜索 -->
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center space-x-3">
                <img 
                    src="https://placehold.co/40x40/7C3AED/FFFFFF?text=AW" 
                    alt="User Avatar" 
                    class="w-10 h-10 rounded-full border-2 border-white"
                />
                <div>
                    <p class="text-xs text-gray-400">欢迎回来</p>
                    <p class="font-semibold text-lg">Adam William</p>
                </div>
            </div>
            <button class="p-2 rounded-full hover:bg-white/10 transition-colors">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
        </header>

        <!-- 主标题 -->
        <h1 class="text-5xl font-extrabold mb-8 max-w-sm leading-tight">
            让我们探索<br/>新的领域
        </h1>

        <!-- 标签过滤 -->
        <div class="flex space-x-3 mb-12 overflow-x-auto pb-2">
            <button class="bg-white text-black font-semibold py-2 px-5 rounded-full text-sm shadow-lg">全部</button>
            <button class="bg-[#1C102A] text-white hover:bg-white/20 py-2 px-5 rounded-full text-sm border border-white/20">编程</button>
            <button class="bg-[#1C102A] text-white hover:bg-white/20 py-2 px-5 rounded-full text-sm border border-white/20">设计</button>
            <button class="bg-[#1C102A] text-white hover:bg-white/20 py-2 px-5 rounded-full text-sm border border-white/20">商业</button>
        </div>

        <!-- 课程卡片网格和日程表 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-16">
            <!-- 课程卡片区 (占 2/3 宽度) -->
            <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- 课程卡片 1: UI/UX 设计 -->
                <div class="relative p-5 rounded-3xl card-bg-1 shadow-xl overflow-hidden min-h-[140px] transform transition duration-300 hover:scale-[1.03]">
                    <div class="absolute top-2 right-2 w-3 h-3 rounded-full bg-white opacity-70 filter blur-sm"></div>
                    <div class="flex justify-between items-start mb-4 z-10 relative">
                        <div class="text-sm font-semibold text-white p-1 px-3 rounded-full bg-black/20 backdrop-blur-sm">设计</div>
                        <div class="w-6 h-6 rounded-full bg-white/20 backdrop-blur flex items-center justify-center cursor-pointer hover:bg-white/40 transition">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </div>
                    <h3 class="text-white text-xl font-bold mt-4 z-10 relative">UI/UX 设计</h3>
                    <p class="text-white/80 text-sm z-10 relative">了解用户体验与界面设计原则。</p>
                    <div class="absolute inset-0 opacity-20">
                        <div class="absolute -bottom-10 -right-10 w-24 h-24 rounded-full bg-pink-400 filter blur-xl"></div>
                    </div>
                </div>

                <!-- 课程卡片 2: Advanced .Net -->
                <div class="relative p-5 rounded-3xl card-bg-2 shadow-xl overflow-hidden min-h-[140px] transform transition duration-300 hover:scale-[1.03]">
                    <div class="absolute top-2 right-2 w-3 h-3 rounded-full bg-white opacity-70 filter blur-sm"></div>
                    <div class="flex justify-between items-start mb-4 z-10 relative">
                        <div class="text-sm font-semibold text-white p-1 px-3 rounded-full bg-black/20 backdrop-blur-sm">编程</div>
                        <div class="w-6 h-6 rounded-full bg-white/20 backdrop-blur flex items-center justify-center cursor-pointer hover:bg-white/40 transition">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </div>
                    <h3 class="text-white text-xl font-bold mt-4 z-10 relative">Advanced .Net</h3>
                    <p class="text-white/80 text-sm z-10 relative">高级编程实践和框架应用。</p>
                    <div class="absolute inset-0 opacity-20">
                        <div class="absolute -bottom-10 -right-10 w-24 h-24 rounded-full bg-yellow-400 filter blur-xl"></div>
                    </div>
                </div>
                
                <!-- 课程卡片 3: 数字艺术 -->
                <div class="relative p-5 rounded-3xl card-bg-3 shadow-xl overflow-hidden min-h-[140px] transform transition duration-300 hover:scale-[1.03]">
                    <div class="absolute top-2 right-2 w-3 h-3 rounded-full bg-white opacity-70 filter blur-sm"></div>
                    <div class="flex justify-between items-start mb-4 z-10 relative">
                        <div class="text-sm font-semibold text-white p-1 px-3 rounded-full bg-black/20 backdrop-blur-sm">设计</div>
                        <div class="w-6 h-6 rounded-full bg-white/20 backdrop-blur flex items-center justify-center cursor-pointer hover:bg-white/40 transition">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </div>
                    <h3 class="text-white text-xl font-bold mt-4 z-10 relative">数字艺术</h3>
                    <p class="text-white/80 text-sm z-10 relative">绘画与数字工具的创意表达。</p>
                    <div class="absolute inset-0 opacity-20">
                        <div class="absolute -bottom-10 -right-10 w-24 h-24 rounded-full bg-green-400 filter blur-xl"></div>
                    </div>
                </div>

                <!-- 课程卡片 4: 文案策划 -->
                <div class="relative p-5 rounded-3xl card-bg-4 shadow-xl overflow-hidden min-h-[140px] transform transition duration-300 hover:scale-[1.03]">
                    <div class="absolute top-2 right-2 w-3 h-3 rounded-full bg-white opacity-70 filter blur-sm"></div>
                    <div class="flex justify-between items-start mb-4 z-10 relative">
                        <div class="text-sm font-semibold text-white p-1 px-3 rounded-full bg-black/20 backdrop-blur-sm">信息</div>
                        <div class="w-6 h-6 rounded-full bg-white/20 backdrop-blur flex items-center justify-center cursor-pointer hover:bg-white/40 transition">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </div>
                    <h3 class="text-white text-xl font-bold mt-4 z-10 relative">文案策划</h3>
                    <p class="text-white/80 text-sm z-10 relative">信息与营销技巧的有效结合。</p>
                    <div class="absolute inset-0 opacity-20">
                        <div class="absolute -bottom-10 -right-10 w-24 h-24 rounded-full bg-purple-400 filter blur-xl"></div>
                    </div>
                </div>
            </div>
            
            <!-- 日程表卡片 (占 1/3 宽度) -->
            <div class="lg:col-span-1 p-6 rounded-3xl bg-[#1C102A] text-white shadow-2xl h-full flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold">课程表</h2>
                    <div class="flex space-x-2 text-gray-400">
                        <button class="hover:text-white transition">&lt;</button>
                        <button class="hover:text-white transition">&gt;</button>
                    </div>
                </div>

                <h3 class="text-2xl font-bold mb-4">八月 2024</h3>

                <!-- 日历网格 -->
                <div class="grid grid-cols-7 gap-2 text-center text-sm mb-6">
                    <span class="text-gray-400 text-xs font-semibold">周一</span>
                    <span class="text-gray-400 text-xs font-semibold">周二</span>
                    <span class="text-gray-400 text-xs font-semibold">周三</span>
                    <span class="text-gray-400 text-xs font-semibold">周四</span>
                    <span class="text-gray-400 text-xs font-semibold">周五</span>
                    <span class="text-gray-400 text-xs font-semibold">周六</span>
                    <span class="text-gray-400 text-xs font-semibold">周日</span>
                    
                    <!-- 模拟日期数据 -->
                    <div class="col-start-4"></div>
                    <!-- 日期 17 被选中，模仿图片 -->
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">14</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">15</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">16</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition bg-purple-600 text-white shadow-lg">17</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">18</div>
                    <!-- 更多日期... -->
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">19</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">20</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">21</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">22</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">23</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">24</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">25</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">26</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">27</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">28</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">29</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">30</div>
                    <div class="p-1.5 rounded-lg font-medium cursor-pointer transition hover:bg-white/10 text-gray-300">31</div>
                </div>

                <!-- 当天课程详情 -->
                <h4 class="text-base text-gray-400 mt-2 mb-3">06:00 - 07:00 PM</h4>
                <div class="p-4 rounded-xl bg-purple-700/50 relative overflow-hidden transition hover:bg-purple-600 cursor-pointer">
                    <h5 class="font-bold text-lg text-white">组件与变体</h5>
                    <p class="text-sm text-gray-200">主讲人：Adam Smith</p>
                    <div class="absolute top-2 right-2 w-4 h-4 rounded-full bg-white flex items-center justify-center">
                        <svg class="w-3 h-3 text-purple-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 底部导航 (模仿图片底部的圆形 home 和 dots) -->
    <div class="fixed bottom-0 left-0 right-0 p-4 md:p-6 flex justify-center z-20 bottom-nav">
        <div class="flex space-x-6 items-center p-3 rounded-full bg-black/50 backdrop-blur-lg shadow-2xl border border-white/10">
            <!-- Home Button -->
            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-inner cursor-pointer hover:scale-105 transition-transform">
                <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </div>
            <!-- Dots/Profile -->
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center cursor-pointer">
               <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zm0 8a2 2 0 110-4 2 2 0 010 4zm-2 2a2 2 0 104 0 2 2 0 00-4 0z"></path></svg>
            </div>
        </div>
    </div>

</body>
</html>
