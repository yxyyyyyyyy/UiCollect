<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sonic Void - 3D Music Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            transition: opacity 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        p {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .btn-container {
            position: relative;
            overflow: hidden;
        }

        .upload-btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
        }

        .upload-btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 30px #00ffff;
        }

        #file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 3;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none; /* Initial state */
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            pointer-events: auto;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        #track-info {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #track-name {
            font-size: 1.2rem;
            font-weight: bold;
        }
        #track-status {
            font-size: 0.8rem;
            color: #00ffff;
            margin-top: 5px;
        }
        body { background: #0b1020; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        #canvas-container { inset: 0; background: radial-gradient(circle at 62% 46%, #152146, #080d1c 65%); }
        #idle-visual { position: absolute; z-index: 2; left: 53%; top: 50%; width: min(46vw, 580px); aspect-ratio: 1; border: 1px solid rgba(129, 210, 236, .15); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 0 35px rgba(126, 100, 195, .025), 0 0 0 90px rgba(126, 100, 195, .018); }
        #idle-visual::before, #idle-visual::after { content: ''; position: absolute; inset: 13%; border: 1px dashed rgba(150, 218, 240, .24); border-radius: 50%; }
        #idle-visual::after { inset: -20%; border-style: solid; border-color: rgba(165, 133, 225, .08); }
        #ui-layer { top: clamp(36px, 8vh, 90px); left: clamp(25px, 6vw, 100px); width: min(380px, calc(100vw - 50px)); height: auto; display: block; background: transparent; backdrop-filter: none; pointer-events: none; }
        #ui-layer > * { pointer-events: auto; }
        #ui-layer h1 { margin: 15px 0 10px; color: #f5f4fa; background: none; -webkit-text-fill-color: currentColor; font-size: clamp(42px, 5.8vw, 78px); font-weight: 650; letter-spacing: -.055em; line-height: 1.05; text-shadow: none; text-transform: none; }
        #ui-layer .eyebrow { margin: 0; color: #92d4df; font-size: 11px; font-weight: 700; letter-spacing: .28em; }
        #ui-layer .subtitle { max-width: 315px; margin: 16px 0 25px; color: #aeb9ce; font-size: 14px; line-height: 1.8; letter-spacing: 0; }
        .btn-container { display: inline-block; border-radius: 12px; }
        .upload-btn { padding: 12px 23px; border: 1px solid #a8d9df; border-radius: 12px; color: #eafcff; background: rgba(111, 198, 210, .12); font-size: 14px; letter-spacing: .04em; text-transform: none; }
        .upload-btn:hover { color: #08111b; background: #abe4e9; box-shadow: 0 6px 24px rgba(78, 200, 219, .2); }
        #ui-layer .file-note { margin: 12px 0 0; color: #8290a7; font-size: 11px; letter-spacing: .02em; }
        #track-info { top: auto; bottom: 35px; left: clamp(25px, 6vw, 100px); opacity: 1; }
        #track-name { font-size: 13px; color: #e8eff5; }
        #track-status { color: #90b6c5; font-size: 11px; letter-spacing: .16em; }
        #controls { left: auto; right: 38px; transform: none; gap: 8px; }
        #visual-fallback { position: absolute; z-index: 20; right: 35px; top: 35px; max-width: 240px; padding: 16px; border-radius: 14px; color: #eafcff; background: rgba(14, 27, 44, .85); }
        @media (max-width: 720px) { #ui-layer { top: 28px; left: 24px; } #ui-layer h1 { font-size: 46px; } #idle-visual { left: 50%; top: 60%; width: 72vw; } #track-info { bottom: 25px; left: 24px; } #controls { right: 18px; bottom: 20px; } }
        @media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="idle-visual" aria-hidden="true"></div>
    <div id="visual-fallback" hidden>当前浏览器无法显示 3D 场景。建议用支持 WebGL 的浏览器观看。</div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <p class="eyebrow">SOUND / SPACE / LIGHT</p>
        <h1>听见声音的<br>形状。</h1>
        <p class="subtitle">还没选歌，也能先看看这片会呼吸的光。放入一段本地音频，粒子和光环会跟着节奏变化。</p>
        
        <div class="btn-container">
            <button class="upload-btn">选择本地音频 ↗</button>
            <input type="file" id="file-input" accept="audio/*">
        </div>
        <p class="file-note">支持 MP3 / WAV / OGG · 文件只在本机播放</p>
    </div>

    <!-- Track Info -->
    <div id="track-info">
        <div id="track-name">Sonic Void · 待机光场</div>
        <div id="track-status">等待一首歌</div>
    </div>

    <!-- Controls -->
    <div id="controls">
        <button class="control-btn" onclick="togglePlay()">播放 / 暂停</button>
        <button class="control-btn" onclick="changeColorTheme()">切换色彩</button>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Post-processing -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <!-- Controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Variables ---
        let scene, camera, renderer, composer, controls;
        let analyser, dataArray;
        let audioContext, audioElement, audioSource;
        let isPlaying = false;

        // Objects
        let bassMesh, wireMesh;
        let ringGroup;
        let particles, particleGeo;
        let particleVelocities; // To store individual speeds

        // Config
        const FFT_SIZE = 128; // Frequency bins (must be power of 2)
        const BAR_COUNT = 64; // Number of bars in the ring
        let themeIndex = 0;
        const THEMES = [
            { main: 0x00ffff, sec: 0xff00ff, bg: 0x050510 }, // Cyberpunk
            { main: 0xff3333, sec: 0xffaa00, bg: 0x100505 }, // Magma
            { main: 0x33ff33, sec: 0x00aa00, bg: 0x051005 }, // Matrix
            { main: 0xffffff, sec: 0xaaaaaa, bg: 0x000000 }  // Starlight
        ];

        // Init
        try {
            if (!window.THREE) throw new Error('Three.js unavailable');
            init();
            animate();
        } catch (error) {
            document.getElementById('visual-fallback').hidden = false;
            console.error(error);
        }

        function init() {
            // 1. Scene Setup
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(THEMES[0].bg, 0.02);
            scene.background = new THREE.Color(THEMES[0].bg);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            // 2. Post Processing (Bloom)
            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, 0.4, 0.85
            );
            bloomPass.threshold = 0;
            bloomPass.strength = 1.2; // Glow strength
            bloomPass.radius = 0.5;

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 3. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.maxDistance = 20;
            controls.minDistance = 3;

            // 4. Create Visual Elements
            createCentralCore();
            createSpectrumRing();
            createParticleTunnel();

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // 6. Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.getElementById('file-input').addEventListener('change', handleFileUpload);
        }

        // --- Visual Creation Functions ---

        function createCentralCore() {
            // Inner glowing core (Icosahedron)
            const geo = new THREE.IcosahedronGeometry(1, 1); // Radius 1, Detail 1
            const mat = new THREE.MeshBasicMaterial({ 
                color: THEMES[0].main, 
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            bassMesh = new THREE.Mesh(geo, mat);
            scene.add(bassMesh);

            // Outer shell (slightly larger, different rotation)
            const geo2 = new THREE.IcosahedronGeometry(1.2, 0);
            const mat2 = new THREE.MeshBasicMaterial({ 
                color: THEMES[0].sec, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            wireMesh = new THREE.Mesh(geo2, mat2);
            scene.add(wireMesh);
        }

        function createSpectrumRing() {
            ringGroup = new THREE.Group();
            const radius = 3;
            
            for (let i = 0; i < BAR_COUNT; i++) {
                const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                // Shift center so it scales from bottom
                geometry.translate(0, 0.05, 0); 
                
                const material = new THREE.MeshBasicMaterial({ color: THEMES[0].sec });
                const bar = new THREE.Mesh(geometry, material);
                
                // Position in a circle
                const angle = (i / BAR_COUNT) * Math.PI * 2;
                bar.position.x = Math.cos(angle) * radius;
                bar.position.z = Math.sin(angle) * radius;
                bar.rotation.y = -angle; // Face outward
                
                ringGroup.add(bar);
            }
            scene.add(ringGroup);
            // Tilt the ring slightly
            ringGroup.rotation.x = Math.PI / 6; 
        }

        function createParticleTunnel() {
            particleGeo = new THREE.BufferGeometry();
            const count = 2000;
            const posArray = new Float32Array(count * 3);
            particleVelocities = [];

            for(let i=0; i<count; i++) {
                // Random position in a large cylinder/tunnel
                const angle = Math.random() * Math.PI * 2;
                // Radius between 5 and 30
                const radius = 5 + Math.random() * 25; 
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                const z = (Math.random() - 0.5) * 60; // Spread along depth

                posArray[i*3] = x;
                posArray[i*3+1] = y;
                posArray[i*3+2] = z;

                // Base velocity
                particleVelocities.push(0.05 + Math.random() * 0.1);
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const mat = new THREE.PointsMaterial({
                size: 0.05,
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true
            });

            particles = new THREE.Points(particleGeo, mat);
            scene.add(particles);
        }

        // --- Audio Handling ---

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Update UI
            document.getElementById('ui-layer').style.opacity = '0';
            setTimeout(() => { document.getElementById('ui-layer').style.display = 'none'; }, 800);
            
            document.getElementById('controls').style.opacity = '1';
            document.getElementById('controls').style.pointerEvents = 'auto';
            document.getElementById('track-info').style.opacity = '1';
            document.getElementById('track-name').innerText = file.name.replace(/\.[^/.]+$/, "");
            document.getElementById('track-status').innerText = "正在播放";

            // Init Audio Context
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            audioContext.resume();

            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
            }

            audioElement = new Audio();
            audioElement.src = URL.createObjectURL(file);
            audioElement.crossOrigin = "anonymous";
            
            audioSource = audioContext.createMediaElementSource(audioElement);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = FFT_SIZE * 2; // FFT size needs to be double the bins
            
            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);

            dataArray = new Uint8Array(analyser.frequencyBinCount);

            audioElement.play();
            isPlaying = true;
        }

        function togglePlay() {
            if (!audioElement) return;
            if (isPlaying) {
                audioElement.pause();
                document.getElementById('track-status').innerText = "已暂停";
                controls.autoRotate = false;
            } else {
                audioElement.play();
                document.getElementById('track-status').innerText = "正在播放";
                controls.autoRotate = true;
            }
            isPlaying = !isPlaying;
        }

        function changeColorTheme() {
            themeIndex = (themeIndex + 1) % THEMES.length;
            const theme = THEMES[themeIndex];

            // Update materials
            bassMesh.material.color.setHex(theme.main);
            wireMesh.material.color.setHex(theme.sec);
            scene.fog.color.setHex(theme.bg);
            scene.background.setHex(theme.bg);
            
            // Update Ring colors
            ringGroup.children.forEach(child => {
                child.material.color.setHex(theme.sec);
            });
        }

        // --- Animation Loop ---

        function animate() {
            requestAnimationFrame(animate);
            if (document.hidden) return;
            const idle = !analyser || !isPlaying;
            const idleTime = performance.now() * .001;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Get Audio Data
            let avgFreq = 0;
            if (analyser && isPlaying) {
                analyser.getByteFrequencyData(dataArray);
                
                // Calculate average volume (bass strength)
                let sum = 0;
                // Focus on lower frequencies for the bass object
                for(let i=0; i<dataArray.length/2; i++) {
                    sum += dataArray[i];
                }
                avgFreq = sum / (dataArray.length/2);
            }

            // 1. Animate Bass Core
            // Scale based on volume
            const scale = idle ? 1.06 + (reducedMotion ? 0 : Math.sin(idleTime * 1.6) * .06) : 1 + (avgFreq / 256) * 1.5;
            bassMesh.scale.set(scale, scale, scale);
            bassMesh.rotation.x += 0.01;
            bassMesh.rotation.y += 0.01;
            
            // Outer wireframe rotates opposite
            wireMesh.rotation.x -= 0.005;
            wireMesh.rotation.y -= 0.005;
            wireMesh.scale.set(scale * 1.2, scale * 1.2, scale * 1.2);

            // 2. Animate Spectrum Ring
            {
                const step = analyser ? Math.floor(dataArray.length / BAR_COUNT) : 1;
                for (let i = 0; i < BAR_COUNT; i++) {
                    const value = idle ? 24 + Math.sin(idleTime * 2 + i * .26) * 18 : dataArray[i * step];
                    const bar = ringGroup.children[i];
                    
                    // Smooth scaling
                    const targetScale = 1 + (value / 256) * 10;
                    // Linear interpolation (lerp) for smoother animation
                    bar.scale.y += (targetScale - bar.scale.y) * 0.2;
                    
                    // Dynamic color brightness based on intensity
                    const intensity = value / 256;
                    bar.material.color.setHSL(i/BAR_COUNT, 1, 0.2 + intensity * 0.5);
                }
                if (!reducedMotion) ringGroup.rotation.z += 0.002;
            }

            // 3. Animate Particles (Tunnel Effect)
            const positions = particleGeo.attributes.position.array;
            // Speed up based on music intensity
            const speedMultiplier = reducedMotion ? 0 : 1 + (avgFreq / 256) * 5;

            for(let i=0; i<2000; i++) {
                // Move along Z axis towards camera
                positions[i*3 + 2] += particleVelocities[i] * speedMultiplier;

                // Reset if passed camera
                if(positions[i*3 + 2] > 20) {
                    positions[i*3 + 2] = -40;
                }
            }
            particleGeo.attributes.position.needsUpdate = true;
            // Spin the tunnel
            particles.rotation.z += 0.001 * speedMultiplier;

            // Render
            controls.update();
            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
